# Empaquetado ResumenTPV con PyInstaller (onedir) en Windows y macOS.
name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  pyinstaller:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: ResumenTPV-Windows-x64
          - os: macos-14
            name: ResumenTPV-macOS-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: uv sync, JARs y build
        shell: bash
        run: |
          set -e
          uv sync --extra build
          uv run python scripts/fetch_maven_jars.py
          uv run python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          jars = sorted(Path("lib").glob("*.jar"))
          if not jars:
              raise RuntimeError("No hay JARs en lib/. Revise scripts/fetch_maven_jars.py")

          cp = os.pathsep.join(str(j) for j in jars)
          subprocess.run(
              ["javac", "-encoding", "UTF-8", "-cp", cp, "AccessReader.java"],
              check=True,
          )
          PY
          uv run pyinstaller ResumenTPV.spec

      - name: Comprimir carpeta (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/ResumenTPV -DestinationPath "dist/${{ matrix.name }}.zip" -Force

      - name: Comprimir .app o carpeta (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          cd dist
          if [ -d ResumenTPV.app ]; then
            zip -ry9 "${{ matrix.name }}.zip" ResumenTPV.app
          else
            zip -ry9 "${{ matrix.name }}.zip" ResumenTPV
          fi

      - name: Subir zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}.zip
          if-no-files-found: error

      - name: Adjuntar zip a GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.name }}.zip
