# Build ResumenTPV (C# / WinForms) en Windows
name: Build

on:
  push:
    branches: [main, master, csharp-rewrite]
  pull_request:
    branches: [main, master, csharp-rewrite]
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore y publish win-x64
        shell: bash
        run: |
          set -e
          dotnet restore ResumenTPV.sln
          dotnet publish src/ResumenTPV/ResumenTPV.csproj \
            -c Release \
            -r win-x64 \
            --self-contained true \
            -o dist/ResumenTPV

      - name: Comprimir carpeta
        shell: pwsh
        run: |
          Compress-Archive -Path dist/ResumenTPV -DestinationPath dist/ResumenTPV-Windows-x64.zip -Force

      - name: Subir zip
        uses: actions/upload-artifact@v4
        with:
          name: ResumenTPV-Windows-x64
          path: dist/ResumenTPV-Windows-x64.zip
          if-no-files-found: error

      - name: Adjuntar zip a GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ResumenTPV-Windows-x64.zip
