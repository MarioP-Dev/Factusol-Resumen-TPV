# Build + empaquetado Velopack (instalador + OTA)
name: Build

on:
  push:
    branches: [main, master, csharp-rewrite]
  pull_request:
    branches: [main, master, csharp-rewrite]
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Leer versión del csproj
        id: get-version
        shell: bash
        run: |
          version=$(grep -oP '(?<=<Version>)[^<]+' src/ResumenTPV/ResumenTPV.csproj | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Versión: $version"

      - name: Restore y publish win-x64
        shell: bash
        run: |
          set -e
          dotnet restore ResumenTPV.sln
          dotnet publish src/ResumenTPV/ResumenTPV.csproj \
            -c Release \
            -r win-x64 \
            --self-contained true \
            -p:Version=${{ steps.get-version.outputs.version }} \
            -o publish

      - name: Instalar vpk (misma versión que el paquete NuGet)
        shell: bash
        run: dotnet tool install -g vpk --version 1.2.158

      - name: Descargar releases anteriores (deltas)
        if: github.event_name == 'release'
        shell: bash
        run: |
          vpk download github \
            --repoUrl "https://github.com/${{ github.repository }}" \
            --token "${{ secrets.GITHUB_TOKEN }}" \
            || true

      - name: Empaquetar con Velopack
        shell: bash
        run: |
          vpk pack \
            --packId ResumenTPV \
            --packVersion "${{ steps.get-version.outputs.version }}" \
            --packDir publish \
            --mainExe ResumenTPV.exe \
            --packTitle "ResumenTPV" \
            --runtime win-x64 \
            --outputDir releases

      - name: Subir artefactos de build
        uses: actions/upload-artifact@v4
        with:
          name: ResumenTPV-Velopack-Windows-x64
          path: |
            releases/*Setup.exe
            releases/*.nupkg
            releases/releases.*.json
            releases/RELEASES
          if-no-files-found: error

      - name: Publicar en GitHub Release (OTA)
        if: github.event_name == 'release'
        shell: bash
        run: |
          tag="${{ github.event.release.tag_name }}"
          vpk upload github \
            --repoUrl "https://github.com/${{ github.repository }}" \
            --token "${{ secrets.GITHUB_TOKEN }}" \
            --outputDir releases \
            --publish \
            --merge \
            --releaseName "ResumenTPV ${{ steps.get-version.outputs.version }}" \
            --tag "$tag"
